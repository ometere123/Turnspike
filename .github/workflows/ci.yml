name: ci
on:
  push:
  pull_request:

jobs:
  contracts-gateway:
    name: contracts, middleware, gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - name: type-check the gateway and middleware build
        run: npx tsc -p tsconfig.build.json --noEmit
      - name: contract tests
        run: npx hardhat test
      - name: build client SDK and install CLI (CLI tests import the built client)
        run: |
          (cd packages/client && npm install && npm run build)
          (cd packages/cli && npm install)
      - name: middleware, gateway, client SDK and CLI tests (local Hardhat chain)
        run: npx vitest run
      - name: production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: secret scan (TEST-S02)
        run: |
          if git grep -nIE '(BEGIN [A-Z ]*PRIVATE KEY|mnemonic\s*[:=]|HMAC_SECRET=[A-Za-z0-9+/]{20,}|DEMO_AGENT_KEY=0x[0-9a-fA-F]{64})' -- . ':!docs' ':!.env.example' ':!packages/middleware/test' ':!apps/gateway/test' ':!scripts' ':!.github'; then echo "possible secret"; exit 1; fi

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  package-example:
    name: packages, examples and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: build the middleware package
        working-directory: packages/middleware
        run: npm install && npm run build
      - name: build the client SDK and the CLI packages
        run: |
          (cd packages/client && npm install && npm run build)
          (cd packages/cli && npm install && npm run build && node dist/bin.js --help > /dev/null)
      - name: build the node-agent example against the built client
        working-directory: examples/node-agent
        run: npm install && npm run build
      - name: build the example against the built package
        working-directory: examples/express-api
        run: npm install && npm run build
      - name: example answers an unpaid request with a 402
        working-directory: examples/express-api
        env:
          MERCHANT_ADDRESS: "0xceeFC1Cf07984D823Db90FaC317069F8BDCDB761"
          HMAC_SECRET: "ci-example-secret-0123456789abcdef0123456789"
          PORT: "3055"
          DB_PATH: "/tmp/example.sqlite"
          TURNSPIKE_LOG: "off"
          RECONCILE: "false"
        run: |
          node dist/server.js &
          for i in $(seq 1 20); do curl -s localhost:3055/healthz && break; sleep 0.5; done
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" localhost:3055/v1/quote)
          cat /tmp/out.json; echo
          test "$code" = "402"
      - name: two-sided end-to-end on built packages (local chain)
        run: |
          npm ci --legacy-peer-deps && npx hardhat compile
          node examples/end-to-end/run.mjs | tee /tmp/e2e.txt
          grep -q "END-TO-END OK" /tmp/e2e.txt

  x402:
    name: x402 package (tsc, vitest) and x402 agent local demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: root deps and contract artifacts (the specs and the demo start Hardhat from the root and read artifacts/)
        run: npm ci --legacy-peer-deps && npx hardhat compile
      - name: packages/x402 deps
        working-directory: packages/x402
        run: npm ci
      - name: packages/x402 type-check and specs (own vitest config, *.spec.ts, not collected by the root run)
        working-directory: packages/x402
        run: npx tsc --noEmit && npx vitest run
      - name: x402 agent local two-sided demo (local Hardhat chain)
        run: node examples/x402-agent/run-local.mjs

  regression:
    # O3: the full regression gate on clean installs (npm ci everywhere). Every step fails the job on error: with an explicit
    # `shell: bash` GitHub runs each step with `bash -eo pipefail`, so a failing command inside a pipe fails the step too.
    name: regression gate (npm ci; turnspike/1 compat diff, x402, middleware, client, root, hardhat, demos)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the compat diff checks origin/main out into a temporary worktree
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: make origin/main available for the compat diff
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: root deps and contract artifacts
        run: npm ci --legacy-peer-deps && npx hardhat compile
      - name: packages/middleware, packages/client, packages/cli and packages/x402 deps (npm ci) and builds
        run: |
          (cd packages/middleware && npm ci && npm run build)
          (cd packages/client && npm ci && npm run build)
          (cd packages/cli && npm ci)
          (cd packages/x402 && npm ci)
      - name: turnspike/1 compat diff vs origin/main (exits non-zero on any difference outside the exposeHeaders delta)
        run: node scripts/compat/turnspike1-diff.mjs
      - name: packages/x402 type-check
        working-directory: packages/x402
        run: npx tsc --noEmit
      - name: packages/x402 specs
        working-directory: packages/x402
        run: npx vitest run
      - name: middleware tests
        run: npx vitest run packages/middleware
      - name: client tests
        run: npx vitest run packages/client
      - name: root vitest (middleware, gateway, client SDK, CLI)
        run: npx vitest run
      - name: hardhat regression suite
        run: npx hardhat test
      - name: x402 agent local two-sided demo (local Hardhat chain)
        run: |
          node examples/x402-agent/run-local.mjs | tee /tmp/x402-demo.txt
          grep -q "X402 LOCAL DEMO OK" /tmp/x402-demo.txt
      - name: turnspike/1 end-to-end on built packages (local Hardhat chain)
        run: |
          node examples/end-to-end/run.mjs | tee /tmp/e2e.txt
          grep -q "END-TO-END OK" /tmp/e2e.txt

  static-analysis:
    name: slither (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps && npx hardhat compile
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install slither-analyzer solc-select && solc-select install 0.8.20 && solc-select use 0.8.20
      - run: slither contracts/TurnpikeAllowance.sol --solc-remaps "@openzeppelin/=node_modules/@openzeppelin/" --filter-paths "node_modules|test-helpers" --exclude-informational --fail-none
